    <script>
    function showNotification(msg, timeout=2500) {
        const n = document.getElementById('notification');
        n.textContent = msg; n.classList.add('show');
        setTimeout(()=> n.classList.remove('show'), timeout);
    }
 
    (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = 'https://www.scorebat.com/embed/embed.js?v=arrv';
        fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'scorebat-jssdk'));
 
    function getTodayDate() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
 
    function formatDate(dateString) {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString || '';
        return date.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
 
    function formatTimeOnly(dateString) {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '';
        return date.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    }
 
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }
 
    function formToChips(form) {
        if (!form || !Array.isArray(form)) return '';
        return form.map(r => {
            const l = (r||'').toUpperCase();
            const cls = l === 'W' ? 'w' : (l === 'D' ? 'd' : 'l');
            return `<span class="form-chip ${cls}">${l==='W'?'V':(l==='D'?'N':'D')}</span>`;
        }).join('');
    }
 
    async function fetchWithTimeout(url, options = {}, timeout = 8000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const resp = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return resp;
        } catch (err) { clearTimeout(id); throw err; }
    }
 
    let globalMatchData = null;
 
    async function loadData() {
        const todayDate = getTodayDate();
        const url = `https://raw.githubusercontent.com/ndriylan31-coder/Flylex-vision/main/prédiction-${todayDate}-analyse-ia.json`;
        const maxRetries = 2;
        let attempt = 0;
        while (attempt <= maxRetries) {
            try {
                const res = await fetchWithTimeout(url, {}, 8000);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                globalMatchData = data;
                return data;
            } catch (err) {
                attempt++;
                if (attempt > maxRetries) throw err;
                await new Promise(r => setTimeout(r, 1000 * attempt));
            }
        }
        throw new Error('Échec de récupération');
    }
 
    function getDetails(data) {
        return (data && data.statistiques_brutes_avec_ia_hors_montecarlo && data.statistiques_brutes_avec_ia_hors_montecarlo.details)
            || (data && data.statistiques_brutes_avec_ia && data.statistiques_brutes_avec_ia.details) || [];
    }
 
    function renderMatches(data) {
        const container = document.getElementById('matchesContainer');
        container.innerHTML = '';
        const details = getDetails(data);
        document.getElementById('sectionTitleRow').style.display = 'flex';
 
        if (!Array.isArray(details) || details.length === 0) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'flex';
            document.getElementById('errorText').textContent = "Aucun pronostic disponible aujourd'hui.";
            return;
        }
 
        details.forEach(match => {
            const card = document.createElement('div');
            card.className = 'home-match-card';
            const odds = match.odds || {};
            const h2h = odds.h2h || {};
            const oddsKeys = Object.keys(h2h);
            let oddsHtml = '';
            if (oddsKeys.length) {
                oddsHtml = '<div class="home-odds-row">';
                oddsKeys.slice(0,3).forEach(k => {
                    const isDraw = k.toLowerCase() === 'draw' || k.toLowerCase().includes('nul');
                    oddsHtml += `<span class="odds-chip ${isDraw?'draw':''}">${h2h[k]}</span>`;
                });
                oddsHtml += '</div>';
            }
            card.innerHTML = `
                <div class="home-match-row">
                    <div class="home-team-col">
                        <div class="home-team-logo">${match.logo_home?`<img src="${match.logo_home}" alt="" onerror="this.style.display='none'">`:''}</div>
                        <div class="team-name">${escapeHtml(match.HomeTeam||'')}</div>
                    </div>
                    <div class="home-match-center">
                        <div class="home-league-tag"><span class="dot"></span>${escapeHtml((match.league||'').split(' - ').pop())}</div>
                        <div class="home-match-time">${formatTimeOnly(match.date)||'--:--'}</div>
                        ${oddsHtml}
                    </div>
                    <div class="home-team-col">
                        <div class="home-team-logo">${match.logo_away?`<img src="${match.logo_away}" alt="" onerror="this.style.display='none'">`:''}</div>
                        <div class="team-name">${escapeHtml(match.AwayTeam||'')}</div>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => openMatchDetails(match));
            container.appendChild(card);
        });
 
        document.getElementById('loadingContainer').style.display = 'none';
        container.style.display = 'block';
    }
 
    function renderScores(data) {
        const container = document.getElementById('scoresContainer');
        container.innerHTML = '';
        const details = getDetails(data);
        if (!Array.isArray(details) || details.length === 0) {
            container.innerHTML = '<div class="r-card"><div class="r-card-title">Aucun score disponible</div></div>';
            return;
        }
        const allScores = [];
        details.forEach(match => {
            const prob = match.Probabilites || null;
            if (prob && prob.scores_probables) {
                Object.entries(prob.scores_probables).forEach(([score, pct]) => allScores.push({ match, score, pct }));
            }
        });
        allScores.sort((a,b) => b.pct - a.pct);
        const top5 = allScores.slice(0,5);
        if (!top5.length) {
            container.innerHTML = '<div class="r-card"><div class="r-card-title">Aucun score probable disponible</div></div>';
            return;
        }
        top5.forEach((item, i) => {
            const m = item.match;
            const card = document.createElement('div');
            card.className = 'score-home-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:10px;">
                    <span>#${i+1} PLUS PROBABLE</span><span>${escapeHtml((m.league||'').split(' - ').pop())}</span>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <div class="home-team-col"><div class="home-team-logo">${m.logo_home?`<img src="${m.logo_home}" onerror="this.style.display='none'">`:''}</div><div class="team-name">${escapeHtml(m.HomeTeam||'')}</div></div>
                    <div style="text-align:center;"><div style="font-size:26px; font-weight:900; color:#38bdf8;">${escapeHtml(item.score)}</div><div style="font-size:11px; color:rgba(255,255,255,0.6);">${item.pct}%</div></div>
                    <div class="home-team-col"><div class="home-team-logo">${m.logo_away?`<img src="${m.logo_away}" onerror="this.style.display='none'">`:''}</div><div class="team-name">${escapeHtml(m.AwayTeam||'')}</div></div>
                </div>
            `;
            card.addEventListener('click', () => openMatchDetails(m));
            container.appendChild(card);
        });
    }
 
    function openMatchDetails(match) {
        document.getElementById('detailsTeam1Name').textContent = match.HomeTeam || 'ÉQUIPE 1';
        document.getElementById('detailsTeam2Name').textContent = match.AwayTeam || 'ÉQUIPE 2';
        document.getElementById('detailsTeam1LogoImg').src = match.logo_home || '';
        document.getElementById('detailsTeam2LogoImg').src = match.logo_away || '';
        document.getElementById('detailsLeagueName').textContent = match.league || '';
        document.getElementById('detailsTimeLine').innerHTML = `Aujourd'hui <span class="value">${formatTimeOnly(match.date)}</span>`;
 
        const tabs = [{ id:'apercu', label:'Aperçu' }, { id:'stats', label:'Stats' }];
        if (match.confrontations_saison_derniere && match.confrontations_saison_derniere.length) tabs.push({ id:'h2h', label:'H2H' });
        if (match.analyse_ia || match.prediction_principale) tabs.push({ id:'prediction', label:'Prédiction IA' });
        if (match.last_matches_home && match.last_matches_home.length) tabs.push({ id:'recents', label:'Matchs récents' });
        if (match.classement_complet && match.classement_complet.length) tabs.push({ id:'classement', label:'Classement' });
 
        const tabsWrapper = document.getElementById('tabsWrapper');
        tabsWrapper.innerHTML = '';
        tabs.forEach((t,i) => {
            const btn = document.createElement('button');
            btn.className = `tab-button ${i===0?'active':''}`;
            btn.dataset.tab = t.id;
            btn.textContent = t.label;
            tabsWrapper.appendChild(btn);
        });
 
        renderTabContents(match, tabs);
        document.getElementById('detailsPage').classList.add('active');
        document.querySelector('.tab-contents-wrapper').scrollTop = 0;
    }
 
    function renderTabContents(match, tabs) {
        const container = document.getElementById('tabContentsContainer');
        container.innerHTML = '';
        tabs.forEach((tab, idx) => {
            const div = document.createElement('div');
            div.className = `tab-content ${idx===0?'active':''}`;
            div.id = 'tab-' + tab.id;
            switch (tab.id) {
                case 'apercu': div.innerHTML = renderApercuTab(match); break;
                case 'stats': div.innerHTML = renderStatsTab(match); break;
                case 'h2h': div.innerHTML = renderH2HTab(match); break;
                case 'prediction': div.innerHTML = renderPredictionTab(match); break;
                case 'recents': div.innerHTML = renderRecentsTab(match); break;
                case 'classement': div.innerHTML = renderClassementTab(match); break;
                default: div.innerHTML = '<div class="r-card">Aucune donnée</div>';
            }
            container.appendChild(div);
        });
    }
 
    function renderApercuTab(match) {
        const prob = match.Probabilites || {};
        const oneX2 = prob['1x2'] || { V1:0, X:0, V2:0 };
        const ou = prob.over_under || {};
        const btts = prob.btts || { oui:0, non:0 };
        const scores = prob.scores_probables || {};
        const odds = match.odds || {};
        const h2hOdds = odds.h2h || {};
        const totalsOdds = odds.totals || {};
        const statsHome = match.stats_home || {};
        const statsAway = match.stats_away || {};
 
        let html = `
            <div class="r-card">
                <div class="r-card-title">Probabilités</div>
                <div class="proba-3col">
                    <div class="proba-box"><div class="lbl">${escapeHtml(match.HomeTeam||'Domicile')}</div><div class="val">${oneX2.V1||0}%</div></div>
                    <div class="proba-box"><div class="lbl">Match nul</div><div class="val">${oneX2.X||0}%</div></div>
                    <div class="proba-box"><div class="lbl">${escapeHtml(match.AwayTeam||'Extérieur')}</div><div class="val">${oneX2.V2||0}%</div></div>
                </div>
                <div class="proba-gradient-bar"></div>
            </div>
        `;
 
        if (Object.keys(h2hOdds).length) {
            const keys = Object.keys(h2hOdds);
            html += `<div class="r-card"><div class="r-card-title">Cotes moyennes</div><div class="odds-3col">`;
            keys.slice(0,3).forEach((k,i) => {
                const sym = i===0?'1':(k.toLowerCase().includes('draw')||k.toLowerCase().includes('nul')?'X':'2');
                html += `<div class="odds-box"><span class="sym">${sym}</span><span class="num">${h2hOdds[k]}</span></div>`;
            });
            html += `</div></div>`;
        }
 
        html += `<div class="r-card"><div class="r-card-title">Plus / Moins de buts</div>`;
        ['0.5','1.5','2.5','3.5'].forEach(s => {
            const over = ou[`plus_de_${s}`];
            if (over !== undefined) {
                html += `<div class="split-row"><span class="lbl">Plus de ${s} buts</span><span class="val">${over}%</span></div>`;
            }
        });
        if (Object.keys(totalsOdds).length) {
            html += `<div style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.08); padding-top:10px;">`;
            Object.entries(totalsOdds).forEach(([k,v]) => {
                html += `<div class="split-row"><span class="lbl">${escapeHtml(k)} (cote)</span><span class="val">${v}</span></div>`;
            });
            html += `</div>`;
        }
        html += `</div>`;
 
        html += `
            <div class="r-card">
                <div class="r-card-title">Les deux équipes marquent (BTTS)</div>
                <div class="split-row"><span class="lbl">Oui</span><span class="val">${btts.oui||0}%</span></div>
                <div class="split-row"><span class="lbl">Non</span><span class="val">${btts.non||0}%</span></div>
            </div>
        `;
 
        if (Object.keys(scores).length) {
            html += `<div class="r-card"><div class="r-card-title">Scores probables</div>`;
            Object.entries(scores).slice(0,5).forEach(([s,p]) => {
                html += `<div class="score-row"><span>${escapeHtml(s)}</span><span>${p}%</span></div>`;
            });
            html += `</div>`;
        }
 
        html += `
            <div class="r-card">
                <div class="r-card-title">Forme des équipes</div>
                <div class="form-strip">${formToChips(statsHome.form_6)}<span class="divider"></span>${formToChips(statsAway.form_6)}</div>
            </div>
        `;
 
        return html;
    }
 
    function renderStatsTab(match) {
        const sh = match.stats_home || {};
        const sa = match.stats_away || {};
        return `
            <div class="r-card">
                <div class="r-card-title">Statistiques générales</div>
                <div class="split-row"><span class="lbl">Buts marqués (moy.)</span><span class="val">${(sh.moyenne_marques||0).toFixed(1)} - ${(sa.moyenne_marques||0).toFixed(1)}</span></div>
                <div class="split-row"><span class="lbl">Buts encaissés (moy.)</span><span class="val">${(sh.moyenne_encaisses||0).toFixed(1)} - ${(sa.moyenne_encaisses||0).toFixed(1)}</span></div>
                <div class="split-row"><span class="lbl">Points / 6 matchs</span><span class="val">${sh.total_points_6||0} - ${sa.total_points_6||0}</span></div>
                <div class="split-row"><span class="lbl">Points / 10 matchs</span><span class="val">${sh.total_points_10||0} - ${sa.total_points_10||0}</span></div>
            </div>
            <div class="r-card">
                <div class="r-card-title">Domicile / Extérieur</div>
                <div class="split-row"><span class="lbl">${escapeHtml(match.HomeTeam||'')} - buts dom.</span><span class="val">${sh.buts_dom_marques||0} / ${sh.buts_dom_encaisses||0}</span></div>
                <div class="split-row"><span class="lbl">${escapeHtml(match.AwayTeam||'')} - buts ext.</span><span class="val">${sa.buts_ext_marques||0} / ${sa.buts_ext_encaisses||0}</span></div>
            </div>
        `;
    }
 
    function renderH2HTab(match) {
        const h2h = match.confrontations_saison_derniere || [];
        return `<div class="r-card"><div class="r-card-title">Confrontations directes</div>${
            h2h.map(m => `<div class="recent-row"><span>${escapeHtml(m.date||'')}</span><span>${escapeHtml(m.team1||'')} ${escapeHtml(m.score||'')} ${escapeHtml(m.team2||'')}</span></div>`).join('') || '<div style="font-size:13px; color:rgba(255,255,255,0.6);">Aucune confrontation récente</div>'
        }</div>`;
    }
 
    function renderPredictionTab(match) {
        return `
            <div class="prediction-hero">
                <div class="p-label">Prédiction principale</div>
                <div class="p-value">${escapeHtml(match.prediction_principale || 'N/A')}</div>
                <div class="p-conf">Confiance : ${Number(match.confiance_pourcentage||50)}%</div>
            </div>
            ${match.analyse_ia ? `<div class="info-box-r">${escapeHtml(match.analyse_ia)}</div>` : ''}
        `;
    }
 
    function renderRecentsTab(match) {
        const list = (matches) => (matches||[]).map(m => `
            <div class="recent-row"><span>${escapeHtml(m.date||'')}</span><span>${escapeHtml(m.home_team||'')} ${escapeHtml(m.score||'')} ${escapeHtml(m.away_team||'')}</span></div>
        `).join('') || '<div style="font-size:13px; color:rgba(255,255,255,0.6);">Aucun match récent</div>';
        return `
            <div class="r-card"><div class="r-card-title">${escapeHtml(match.HomeTeam||'')}</div>${list(match.last_matches_home)}</div>
            <div class="r-card"><div class="r-card-title">${escapeHtml(match.AwayTeam||'')}</div>${list(match.last_matches_away)}</div>
        `;
    }
 
    function renderClassementTab(match) {
        const classement = match.classement_complet || [];
        return `<div class="r-card"><div class="r-card-title">Classement — ${escapeHtml(match.league||'')}</div>${
            classement.map(t => `<div class="rank-row ${(t.team===match.HomeTeam||t.team===match.AwayTeam)?'highlight':''}"><div class="rank-pos">${t.position||''}</div><div class="rank-team">${escapeHtml(t.team||'')}</div><div class="rank-pts">${t.points||0} pts</div></div>`).join('')
        }</div>`;
    }
 
    document.addEventListener('click', function(e) {
        if (e.target.classList && e.target.classList.contains('tab-button')) {
            const tabName = e.target.dataset.tab;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            const content = document.getElementById('tab-' + tabName);
            if (content) content.classList.add('active');
            document.querySelector('.tab-contents-wrapper').scrollTop = 0;
        }
    });
 
    document.getElementById('backButton').addEventListener('click', () => {
        document.getElementById('detailsPage').classList.remove('active');
    });
 
    const sideOverlay = document.getElementById('sideOverlay');
    const sidePanel = document.getElementById('sidePanel');
    document.getElementById('menuBtn').addEventListener('click', () => {
        sideOverlay.classList.add('active');
        sidePanel.classList.add('active');
    });
    sideOverlay.addEventListener('click', () => {
        sideOverlay.classList.remove('active');
        sidePanel.classList.remove('active');
    });
    document.querySelectorAll('.side-panel-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.side-panel-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
            const page = this.dataset.page;
            document.querySelectorAll('.nav-item-f').forEach(n => n.classList.remove('active'));
            document.querySelector(`.nav-item-f[data-page="${page}"]`)?.classList.add('active');
            showPage(page);
            sideOverlay.classList.remove('active');
            sidePanel.classList.remove('active');
        });
    });
 
    function showPage(pageName) {
        document.getElementById('matchesContainer').style.display = 'none';
        document.getElementById('liveContainer').style.display = 'none';
        document.getElementById('scoresContainer').style.display = 'none';
        document.getElementById('loadingContainer').style.display = 'none';
        document.getElementById('errorContainer').style.display = 'none';
        document.getElementById('sectionTitleRow').style.display = 'none';
 
        switch(pageName) {
            case 'pronostic':
                document.getElementById('sectionTitleRow').style.display = 'flex';
                document.getElementById('matchesContainer').style.display = 'block';
                break;
            case 'live':
                document.getElementById('liveContainer').style.display = 'block';
                break;
            case 'scores':
                document.getElementById('sectionTitleRow').style.display = 'flex';
                document.getElementById('scoresContainer').style.display = 'block';
                break;
            case 'profil':
                showNotification('Fonction Profil non disponible dans la démo');
                document.getElementById('sectionTitleRow').style.display = 'flex';
                document.getElementById('matchesContainer').style.display = 'block';
                break;
        }
    }
 
    document.querySelectorAll('.nav-item-f').forEach(item => {
        item.addEventListener('click', function() {
            const page = this.dataset.page;
            document.querySelectorAll('.nav-item-f').forEach(n => n.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.side-panel-item').forEach(i => i.classList.remove('active'));
            document.querySelector(`.side-panel-item[data-page="${page}"]`)?.classList.add('active');
            showPage(page);
        });
    });
 
    async function init() {
        try {
            const data = await loadData();
            renderMatches(data);
            renderScores(data);
        } catch (err) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'flex';
            document.getElementById('errorText').textContent = `Erreur de chargement des données pour aujourd'hui (${getTodayDate()}). Vérifiez que le fichier existe sur GitHub.`;
        }
    }
 
    init();
    </script>
</body>
</html>
